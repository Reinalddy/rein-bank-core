services:
  postgres:
    image: postgres:16-alpine
    container_name: rein-bank-db
    environment:
      POSTGRES_DB: rein_bank
      POSTGRES_USER: rein
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
EOF